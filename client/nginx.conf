server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API calls go to the Express container (service name "server" in docker-compose)
  location /api/ {
    proxy_pass http://server:5001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Vite file names contain a hash, so they can be cached for a long time
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # React Router: any other path returns index.html
  location / {
    try_files $uri /index.html;
  }
}
