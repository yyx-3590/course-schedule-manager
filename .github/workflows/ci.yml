name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # Keep the test MongoDB binary outside node_modules so the cache survives npm ci
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Cache the MongoDB test binary
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/mongodb-binaries
          key: mongodb-memory-server-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: server-coverage
          path: server/coverage
          if-no-files-found: ignore

  client:
    name: Client build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - uses: actions/checkout@v7
      - name: Create the .env that docker compose needs
        run: |
          cp .env.docker.example .env
          sed -i "s/^ACCESS_TOKEN_SECRET=.*/ACCESS_TOKEN_SECRET=$(openssl rand -hex 32)/" .env
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Check the page and the API through nginx
        run: |
          curl --fail --silent --retry 5 --retry-delay 2 --retry-connrefused http://localhost:8080/api/health
          curl --fail --silent http://localhost:8080/ > index.html
          grep -q 'id="root"' index.html
      - name: Register and log in through the whole stack
        run: |
          curl --fail --silent -X POST http://localhost:8080/api/users/register \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci","email":"ci@example.com","password":"password123"}'
          curl --fail --silent -X POST http://localhost:8080/api/users/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"password123"}' | grep -q accessToken
      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  publish:
    name: Publish images to GitHub Container Registry
    # Only after a push to main, never for pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [server, client]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
