services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5001"
      CONNECTION_STRING: mongodb://mongo:27017/course-schedule
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?Set ACCESS_TOKEN_SECRET in the .env file next to docker-compose.yml}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      TRUST_PROXY: "1" # nginx sits in front, so read the real client IP
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  mongo-data:
